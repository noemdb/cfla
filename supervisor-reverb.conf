[program:cfla-reverb]
command=php /home/nuser/code/cfla/artisan reverb:start --host=127.0.0.1 --port=8090
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:cfla-queue]
command=php /home/nuser/code/cfla/artisan queue:work database --sleep=3 --tries=3 --backoff=10
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Worker dedicado para la bitácora de auditoría (Spec BINNACLE-001, ADR-002).
; Cola propia "binnacle": un backlog de auditoría nunca bloquea jobs de negocio.
[program:cfla-binnacle-queue]
command=php /home/nuser/code/cfla/artisan queue:work database --queue=binnacle --sleep=3 --tries=3 --backoff=10
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/binnacle-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
