[program:cfla-reverb]
; IMPORTANTE: usar SIEMPRE /usr/bin/php8.2 (el `php` del sistema es 7.4.33 y
; Reverb/Pulse requieren >= 8.2; con 7.4 muere en platform_check.php).
; host/puerto se toman del .env (REVERB_SERVER_HOST / REVERB_SERVER_PORT).
; En local/producción el server escucha interno en 127.0.0.1:8090 y Apache
; hace el reverse proxy WS hacia este puerto.
command=/usr/bin/php8.2 /home/nuser/code/cfla/artisan reverb:start
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:cfla-queue]
command=/usr/bin/php8.2 /home/nuser/code/cfla/artisan queue:work database --sleep=3 --tries=3 --backoff=10
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Worker dedicado para la bitácora de auditoría (Spec BINNACLE-001, ADR-002).
; Cola propia "binnacle": un backlog de auditoría nunca bloquea jobs de negocio.
[program:cfla-binnacle-queue]
command=/usr/bin/php8.2 /home/nuser/code/cfla/artisan queue:work database --queue=binnacle --sleep=3 --tries=3 --backoff=10
directory=/home/nuser/code/cfla
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nuser
numprocs=1
redirect_stderr=true
stdout_logfile=/home/nuser/code/cfla/storage/logs/binnacle-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
