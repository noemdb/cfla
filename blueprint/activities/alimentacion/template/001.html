<!-- ============================================================
     TEMPLATE: Consolidado de Eje Temático Transversal
     Nivel: Staff Engineer
     Uso: Agente de código recibe un tema concreto y rellena
          el objeto REPORT_DATA al final del <script>.
     Estructura:
       1. CDN (Tailwind + ApexCharts + Fuente)
       2. CSS variables (paleta parametrizable por tema)
       3. HTML semántico (secciones modulares)
       4. Data layer (objeto REPORT_DATA)
       5. Render functions (puro, sin mutación del DOM fuera)
     ============================================================ -->

<!-- CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Configuración Tailwind extendida -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          brand: {
            50:  'var(--brand-50)',
            100: 'var(--brand-100)',
            500: 'var(--brand-500)',
            600: 'var(--brand-600)',
            700: 'var(--brand-700)',
            800: 'var(--brand-800)',
            900: 'var(--brand-900)'

          accent: {
            500: 'var(--accent-500)',
            600: 'var(--accent-600)',
            700: 'var(--accent-700)'
          }
        }
      }
    }

<style>

     El agente puede cambiar estas variables según el tema.

         tema cultura      → amber/orange
     ============================================================ */

    --brand-50:  #f0fdf4;

    --brand-900: #14532d;

    --accent-500: #f59e0b;
    --accent-600: #d97706;
    --accent-700: #b45309;

    --danger-500: #ef4444;
    --danger-600: #dc2626;
    --danger-700: #b91c1c;

    --info-500: #0ea5e9;
    --info-600: #0284c7;
    --info-700: #0369a1;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 12px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.025em;
    white-space: nowrap;
  }

  .card {
    background: white;
    border-radius: 0.75rem;
    box-shadow: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
    transition: box-shadow 0.2s ease;
  }
  .card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.06); }

  .section-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #334155;
    border-left: 4px solid var(--brand-600);
    padding-left: 0.75rem;
    margin-bottom: 1rem;
  }

  .apexcharts-tooltip { font-family: 'Inter', sans-serif; border-radius: 8px; }

  /* Scroll personalizado */
  .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-area::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Animación sutil */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeInUp 0.5s ease-out both; }

  /* Print */
  @media print {
    .no-print { display: none !important; }
    .page-break { page-break-before: always; }
    body { background: white; }
  }
</style>

/* --- Header --- */
function renderHeader(d) {
  $('#header-badges').innerHTML = `
    <span class="chip bg-white/20 text-white">${d.periodo}</span>
    <span class="chip bg-white/20 text-white">${d.nivelEducativo}</span>
    <span class="chip bg-white/20 text-white">${d.avr}</span>
    <span class="chip bg-[var(--accent-500)]/90 text-[var(--brand-900)]">EJE: ${d.ejeTematico.toUpperCase()}</span>
  `;
  $('#header-title').textContent = d.reportTitle;
  $('#header-subtitle').innerHTML =
    `La <b>${d.ejeTematico.toLowerCase()}</b> como eje central para enseñar <b>${d.areasArticuladas}</b>.`;
  $('#header-meta').innerHTML = `
    <span><strong>Fuente:</strong> <code class="bg-black/20 px-2 py-0.5 rounded text-xs">${d.fuente}</code></span>
    <span><strong>Snapshot:</strong> ${d.fechaSnapshot}</span>
    <span><strong>Generado:</strong> ${d.fechaGeneracion}</span>
    <span><strong>Planes:</strong> ${d.totalPlanes} · <strong>Actividades:</strong> ${d.totalActividades}</span>
  `;
}

/* --- KPIs --- */
function renderKPIs(kpis) {
  $('#kpi-grid').innerHTML = kpis.map(k => {
    const c = COLOR_MAP[k.color] || COLOR_MAP.brand;
    return `
      <div class="card p-5 border-t-4 ${c.border}">
        <p class="text-xs uppercase tracking-wide text-slate-500 font-semibold">${k.label}</p>
        <p class="text-4xl font-extrabold ${c.text} mt-2">${k.value}</p>
        <p class="text-xs text-slate-500 mt-1">${k.desc}</p>
      </div>`;
  }).join('');
}

function renderAxes(axes) {
  $('#axes-grid').innerHTML = axes.map(a => {
    const c = COLOR_MAP[a.color] || COLOR_MAP.brand;
    return `
      <div class="card p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-3 h-3 rounded-full ${c.solid}"></span>
          <h3 class="font-semibold text-slate-700">${a.title}</h3>
        </div>
        <p class="text-3xl font-extrabold ${c.text}">
          ${a.count} actividades
          <span class="text-sm font-normal text-slate-500">(${a.percent} %)</span>
        </p>
        <p class="text-sm text-slate-600 mt-3">${a.description}</p>
        <div class="mt-4 text-xs text-slate-500"><b>${a.metadata}</b></div>
      </div>`;
  }).join('');
}

/* --- Gráficos --- */
function renderCharts(charts) {
  $('#chart1-title').textContent = charts.chart1.title;
  $('#chart2-title').textContent = charts.chart2.title;
  $('#chart3-title').textContent = charts.chart3.title;
  $('#chart4-title').textContent = charts.chart4.title;

  const baseOpts = {
    chart: { toolbar:{show:false}, fontFamily:'Inter, sans-serif', animations:{enabled:true, speed:600} },
    tooltip: { theme:'light' },
    dataLabels: { enabled:true, style:{fontSize:'11px', fontWeight:600} },
    legend: { position:'top', fontSize:'13px' }
  };

  // Chart 1: barras agrupadas
  new ApexCharts(document.querySelector('#chart-1'), {
    ...baseOpts,
    chart: { ...baseOpts.chart, type:'bar', height:320 },
    series: charts.chart1.series,
    xaxis: { categories: charts.chart1.categories },
    plotOptions: { bar: { columnWidth:'55%', borderRadius:4 } },
    colors: charts.chart1.colors,
    dataLabels: { enabled:false }
  }).render();

  // Chart 2: dona
  new ApexCharts(document.querySelector('#chart-2'), {
    ...baseOpts,
    chart: { ...baseOpts.chart, type:'donut', height:320 },
    series: charts.chart2.series,
    labels: charts.chart2.labels,
    colors: charts.chart2.colors,
    legend: { ...baseOpts.legend, position:'bottom' },
    plotOptions: { pie: { donut: { size:'65%' } } },
    dataLabels: { ...baseOpts.dataLabels, formatter: v => v.toFixed(0) + '%' }
  }).render();

  // Chart 3: barras horizontales
  new ApexCharts(document.querySelector('#chart-3'), {
    ...baseOpts,
    chart: { ...baseOpts.chart, type:'bar', height:320 },
    series: charts.chart3.series,
    xaxis: { categories: charts.chart3.categories },
    plotOptions: { bar: { borderRadius:4, horizontal:true, distributed:true } },
    colors: charts.chart3.colors,
    legend: { show:false }
  }).render();

  // Chart 4: radial
  new ApexCharts(document.querySelector('#chart-4'), {
    ...baseOpts,
    chart: { ...baseOpts.chart, type:'radialBar', height:320 },
    series: [charts.chart4.value],
    labels: [charts.chart4.label],
    plotOptions: {
      radialBar: {
        startAngle:-135, endAngle:135,
        hollow: { size:'55%' },
        track: { background:'#fecaca' },
        dataLabels: {
          name: { offsetY:-10 },
          value: { fontSize:'28px', fontWeight:700, color:charts.chart4.color, offsetY:10, formatter:v=>v+'%' },
          total: { show:true, label:charts.chart4.totalLabel, color:'#64748b' }
        }
      }
    },
    fill: { colors:[charts.chart4.color] },
    stroke: { lineCap:'round' }
  }).render();
}

/* --- Matriz --- */
function renderMatrix(m) {
  $('#matrix-title').textContent = m.title;
  const thead = `<thead class="bg-brand-800 text-white">
    <tr>${m.headers.map(h=>`<th class="px-4 py-3 ${h===m.headers[0]?'text-left':'text-center'} font-semibold">${h}</th>`).join('')}</tr>
  </thead>`;
  const tbody = `<tbody class="divide-y divide-slate-100">
    ${m.rows.map((r,i)=>{
      const highlight = i >= m.rows.length - 2 ? 'bg-brand-50' : '';
      return `<tr class="hover:bg-slate-50 ${highlight}">
        ${r.map((c,j)=>`<td class="px-4 py-3 ${j===0?'font-medium':'text-center'} ${j===r.length-1?'font-bold':''}">${c===0?'—':c}</td>`).join('')}
      </tr>`;
    }).join('')}
    <tr class="bg-slate-100 font-bold">
      ${m.totals.map((c,j)=>`<td class="px-4 py-3 ${j===0?'':'text-center'}">${c===0?'—':c}</td>`).join('')}
    </tr>
  </tbody>`;
  $('#matrix-table').innerHTML = thead + tbody;
}

/* --- Progresión --- */
function renderProgression(p) {
  $('#progression-title').textContent = p.title;
  const borders = ['border-brand-400','border-brand-500','border-brand-600','border-brand-700','border-teal-600','border-teal-700'];
  $('#progression-grid').innerHTML = p.stages.map((s,i)=>`
    <div class="card p-4 border-t-4 ${borders[i%borders.length]}">
      <p class="text-xs text-slate-500 font-semibold">${s.label}</p>
      <p class="font-bold text-brand-700 mt-1">${s.title}</p>
      <p class="text-xs text-slate-600 mt-2">${s.desc}</p>
    </div>
  `).join('');
}

/* --- Catálogo --- */
function renderCatalog(c) {
  $('#catalog-title').textContent = `${c.title} (${c.rows.length})`;
  const ejeColors = {
    'CNAT':'bg-emerald-100 text-emerald-800',
    'CSOC':'bg-amber-100 text-amber-800',
    'EEST':'bg-purple-100 text-purple-800',
    'LEN':'bg-sky-100 text-sky-800',
    'MAT':'bg-rose-100 text-rose-800',
    'Transversal':'bg-slate-100 text-slate-700'
  };
  const thead = `<thead class="bg-slate-700 text-white sticky top-0">
    <tr>${c.headers.map(h=>`<th class="px-3 py-2 text-left font-semibold">${h}</th>`).join('')}</tr>
  </thead>`;
  const tbody = `<tbody class="divide-y divide-slate-100">
    ${c.rows.map(r=>{
      const eje = (r[2]||'').split('/')[0];
      const chip = ejeColors[eje] || 'bg-slate-100 text-slate-700';
      return `<tr class="hover:bg-slate-50">
        <td class="px-3 py-2 text-slate-500 font-mono">${r[0]}</td>
        <td class="px-3 py-2 font-medium">${r[1]}</td>
        <td class="px-3 py-2"><span class="chip ${chip}">${r[2]}</span></td>
        <td class="px-3 py-2 text-slate-600">${r[3]}</td>
        <td class="px-3 py-2 text-slate-600">${r[4]}</td>
      </tr>`;
    }).join('')}
  </tbody>`;
  $('#catalog-table').innerHTML = thead + tbody;
}

/* --- Hallazgos --- */
function renderFindings(f) {
  $('#findings-title').textContent = f.title;
  $('#findings-grid').innerHTML = f.items.map(it=>`
    <div class="card p-5 border-l-4 ${LEVEL_BORDER[it.level]}">
      <p class="font-bold ${LEVEL_TEXT[it.level]}">${it.title}</p>
      <p class="text-sm text-slate-600 mt-1">${it.desc}</p>
    </div>
  `).join('');
}

/* --- Recomendaciones --- */
function renderRecommendations(r) {
  $('#recommendations-title').textContent = r.title;
  $('#recommendations-list').innerHTML = r.items.map((it,i)=>`
    <li class="p-4 flex gap-3 hover:bg-slate-50 transition-colors">
      <span class="bg-brand-600 text-white font-bold rounded-full w-7 h-7 flex items-center justify-center text-sm shrink-0">${i+1}</span>
      <p class="text-sm text-slate-700"><b>${it.title}</b><br>${it.desc}</p>
    </li>
  `).join('');
}

/* --- Footer --- */
function renderFooter(d) {
  $('#footer').innerHTML = `
    <p>Reporte generado el ${d.fechaGeneracion} · ${d.sistema} · ${d.totalPlanes} planes · ${d.totalActividades} actividades analizadas</p>
    <p class="mt-1">Template v1.0 · Eje temático: ${d.ejeTematico}</p>
  `;
}

/* --- Init --- */
document.addEventListener('DOMContentLoaded', () => {
  const d = REPORT_DATA;
  renderHeader(d);
  renderKPIs(d.kpis);
  renderAxes(d.axes);
  renderCharts(d.charts);
  renderMatrix(d.matrix);
  renderProgression(d.progression);
  renderCatalog(d.catalog);
  renderFindings(d.findings);
  renderRecommendations(d.recommendations);
  renderFooter(d);
});
</script>

</body>
</html>
