; Horizon worker — reemplaza a cfla-queue y cfla-binnacle-queue.
; IMPORTANTE: usar SIEMPRE /usr/bin/php8.2 (el `php` del sistema es 7.4.33 y
; no cumple el requisito "php": "^8.2"). Horizon requiere cola REDIS
; (QUEUE_CONNECTION=redis) y la tabla failed_jobs (php8.2 artisan queue:failed-table).
; El cron (schedule:run) NO se toca: Horizon no ejecuta tareas programadas.

[program:cfla-horizon]
command=/usr/bin/php8.2 /home/cflasf/source/cfla/artisan horizon
directory=/home/cflasf/source/cfla
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/home/cflasf/source/cfla/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
