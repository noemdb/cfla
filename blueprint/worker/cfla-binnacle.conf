; ============================================================
; Supervisor: worker dedicado de la bitácora (cola `binnacle`)
; Spec BINNACLE-001 §4 / ADR-002 / mejora #2
;
; Despliegue: cp cfla-binnacle.conf /etc/supervisor/conf.d/
;   (Debian/Ubuntu)  ·  RHEL/CentOS: /etc/supervisord.d/
;
; Adaptar al servidor real: command, directory, stdout_logfile y user.
; Ejemplo con las rutas reales de producción (usuario cflasf):
;   /home/cflasf/source/cfla
; ============================================================

[program:cfla-binnacle-queue]
command=php8.2 /home/cflasf/source/cfla/artisan queue:work database --queue=binnacle --sleep=3 --tries=3 --backoff=10 --max-jobs=500 --max-time=3600
directory=/home/cflasf/source/cfla
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/home/cflasf/source/cfla/storage/logs/binnacle-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60